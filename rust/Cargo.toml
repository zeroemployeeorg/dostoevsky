# The Rust engine. Phase 1 is a faithful port of the Go engine in the repository root: see PORT-NOTES.md.
# benchmarks/rustcore (the earlier prototype) is a frozen record. It lies outside this directory, is not a member,
# and is not covered by the fmt and clippy gates run here.
[workspace]
resolver = "2"
members = [
    "crates/dostoevsky-wire",
    "crates/dostoevsky-format",
    "crates/dostoevsky-core",
    "crates/dostoevsky-workflow",
    "crates/dostoevsky-server",
    "crates/dostoevsky-cli",
    "crates/dostoevsky-py",
    "crates/dostoevsky-node",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
